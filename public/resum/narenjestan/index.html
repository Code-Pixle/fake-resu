const app=$('#app'),bm=v=>v?'دارد':'ندارد';
const card=p=>`<a class=cd href="#/p/${p.c}"><div class=im>${img(p,0)}<span class="bd ${p.vac=='فوری'?'u':''}">${p.vac=='فوری'?'فوری':p.deal=='sale'?'فروش':'رهن و اجاره'}</span><button class=hr onclick="event.preventDefault();tf('${p.c}');rt()">${fav.includes(p.c)?'♥':'♡'}</button><span class=cdn>${p.c}</span></div><div class=bo><h3>${p.title}</h3><p class=ht>📍 ${p.hood} · ${p.type}</p><div class=sp><span>${N(p.area)} متر</span>${p.beds?`<span>${N(p.beds)} خواب</span>`:''}${p.type=='آپارتمان'?`<span>طبقه ${N(p.fl)}</span>`:''}</div><b class=pr>${price(p)}</b></div></a>`;
function home(){const hc=HOODS.map(h=>[h,PR.filter(p=>p.hood==h).length]).filter(x=>x[1]);
app.innerHTML=`<section class=hero><div class=w><div><span class=kick>املاک شیراز · از خانه تا باغ‌ویلا</span><h1>خانه‌ای که <em>حس خانه</em> بدهد</h1><p class=l>با فیلترهای دقیق، ملک مناسب را در محله‌ی مورد علاقه‌تان در شیراز پیدا کنید؛ از آپارتمان نورگیر تا باغ‌ویلا.</p>
<div class=sc><div class=tabs id=ht><button class=on onclick="ht('sale',this)">خرید</button><button onclick="ht('rent',this)">رهن و اجاره</button></div><div class=srow><select id=hh><option value="">همه‌ی محله‌ها</option>${HOODS.map(h=>`<option>${h}</option>`).join('')}</select><select id=hy><option value="">همه‌ی انواع</option>${TYPES.map(h=>`<option>${h}</option>`).join('')}</select><button class=btn onclick=hs()>جستجو</button></div></div></div>
<div class=arch><div class=im>${img(PR[8],1)}</div><div class="fl f1"><b>${N(PR.length)}+</b>ملک فعال</div><div class="fl f2"><b>${N(HOODS.length)}</b>محله‌ی شیراز</div></div></div></section>
<div class=w><div class=st><div><b>${N(PR.filter(p=>p.deal=='sale').length)}</b>ملک برای فروش</div><div><b>${N(PR.filter(p=>p.deal=='rent').length)}</b>ملک رهن و اجاره</div><div><b>${N(PR.filter(p=>p.vac=='فوری').length)}</b>آگهی فوری</div><div><b>۱۰</b>فیلتر دقیق</div></div>
<section class=s><h2>ملک‌های ویژه</h2><p class=sub>جدیدترین آگهی‌های ثبت‌شده</p><div class=gr>${[...PR].sort((a,b)=>a.days-b.days).slice(0,6).map(card).join('')}</div><p style="text-align:center;margin-top:26px"><a class="btn g" href="#/list">مشاهده‌ی همه‌ی املاک</a></p></section>
<section class=s><h2>محله‌های محبوب</h2><p class=sub>با یک کلیک، فقط همان محله را ببینید</p><div class=hd>${hc.map(h=>`<button onclick="F={...D0,hood:'${h[0]}'};location.hash='#/list'">${h[0]} <b>${N(h[1])}</b></button>`).join('')}</div></section>
<section class=s><h2>چطور کار می‌کند؟</h2><p class=sub>سه قدم تا ملک مناسب</p><div class=how><div><i>🔍</i><h3>جستجو</h3><p>نوع معامله، محله، متراژ و بودجه را مشخص کنید.</p></div><div><i>🏠</i><h3>بازدید</h3><p>از صفحه‌ی ملک، زمان بازدید را ثبت کنید.</p></div><div><i>🤝</i><h3>معامله</h3><p>با مشاوره‌ی کامل، قرارداد را مطمئن امضا کنید.</p></div></div></section>
<section class=s><div class=cta><div><h2>ملک دارید؟</h2><p>آگهی‌تان را در چند دقیقه ثبت کنید.</p></div><button class=btn onclick=md()>ثبت رایگان ملک</button></div></section></div>`}
let hd='sale';function ht(d,b){hd=d;$$('#ht button').forEach(x=>x.classList.toggle('on',x==b))}
function hs(){F={...D0,deal:hd,hood:$('#hh').value,type:$('#hy').value};location.hash='#/list'}
const seg=(k,o)=>`<div class=sg>${o.map(x=>`<button class="${F[k]===x[0]?'on':''}" onclick="set('${k}','${x[0]}',1)">${x[1]}</button>`).join('')}</div>`,rg=(a,b,u)=>`<div class=rg><input type=number inputmode=numeric placeholder="از ${u}" value="${F[a]}" oninput="set('${a}',this.value)"><input type=number inputmode=numeric placeholder="تا ${u}" value="${F[b]}" oninput="set('${b}',this.value)"></div>`;
function panel(){const o=[['','مهم نیست'],['1','دارد'],['0','ندارد']];return `<div class=fh><b>فیلترها</b><span><button class="btn o" style="padding:4px 14px" onclick="F={...D0,sort:F.sort};lst()">پاک‌کردن</button> <button class="fx btn g" style="padding:4px 14px" onclick=fc()>✕</button></span></div>
<div><h4>نوع معامله</h4>${seg('deal',[['','همه'],['sale','فروش'],['rent','رهن و اجاره']])}</div><div><h4>نوع ملک</h4>${seg('type',[['','همه'],...TYPES.map(t=>[t,t])])}</div>
${F.deal=='sale'?`<div><h4>قیمت (میلیون تومان)</h4>${rg('pmin','pmax','')}</div>`:''}${F.deal=='rent'?`<div><h4>ودیعه (میلیون تومان)</h4>${rg('dmin','dmax','')}</div><div><h4>اجاره‌ی ماهانه (میلیون)</h4>${rg('rmin','rmax','')}</div>`:''}
<div><h4>متراژ (متر)</h4>${rg('amin','amax','')}</div><div><h4>حداقل خواب</h4><div class=sg>${[0,1,2,3,4].map(n=>`<button class="${F.beds===n?'on':''}" onclick="set('beds',${n},1)">${n?N(n)+(n==4?' به بالا':''):'همه'}</button>`).join('')}</div></div>
<div><h4>طبقه</h4>${seg('floor',[['','همه'],['0','همکف'],['1','۱ تا ۳'],['4','۴ تا ۶'],['7','۷ به بالا']])}</div><div><h4>محله</h4><select onchange="set('hood',this.value)"><option value="">همه‌ی محله‌ها</option>${HOODS.map(h=>`<option ${F.hood==h?'selected':''}>${h}</option>`).join('')}</select></div>
<div><h4>پارکینگ</h4>${seg('park',o)}</div><div><h4>انباری</h4>${seg('store',o)}</div><div><h4>آسانسور</h4>${seg('elev',o)}</div><div><h4>وضعیت</h4>${seg('vac',[['','همه'],['خالی','خالی'],['در حال سکونت','در حال سکونت'],['فوری','فوری']])}</div><button class="btn g fx" onclick=fc()>نمایش نتایج</button>`}
function set(k,v,re){F[k]=k=='beds'?+v:v;re?lst():rl()}
function fo(){$('#fp').classList.add('open');$('#ov').classList.add('show')}function fc(){$('#fp')&&$('#fp').classList.remove('open');$('#ov').classList.remove('show')}
function rl(){const l=list();$('#cnt').innerHTML=`🏠 ${N(l.length)} ملک یافت شد`;$('#res').innerHTML=l.map(card).join('')||'<p style="grid-column:1/-1;text-align:center;padding:60px;color:var(--mu)">ملکی با این فیلترها پیدا نشد. فیلترها را کم کنید.</p>'}
function lst(){app.innerHTML=`<div class=w><div class=lay><aside class=fp id=fp>${panel()}</aside><div><h2 style="margin-top:20px">${F.fav?'علاقه‌مندی‌ها':'املاک شیراز'}</h2><div class=tb><span class=cnt id=cnt></span><input id=q placeholder="جستجوی زنده: عنوان، محله، کد..." value="${F.q}" oninput="set('q',this.value)"><select onchange="set('sort',this.value)">${[['new','جدیدترین'],['old','قدیمی‌ترین'],['cheap','ارزان‌ترین'],['exp','گران‌ترین']].map(s=>`<option value=${s[0]} ${F.sort==s[0]?'selected':''}>${s[1]}</option>`).join('')}</select><button class=fb onclick=fo()>⚙ فیلترها</button></div><div class=gr id=res></div></div></div></div>`;rl()}
function detail(c){const p=PR.find(x=>x.c==c);if(!p)return home();const sm=PR.filter(x=>x.c!=c&&(x.deal==p.deal||x.hood==p.hood)).slice(0,3);
const sp=[['متراژ',N(p.area)+' متر'],['اتاق خواب',p.beds?N(p.beds):'—'],['طبقه',p.type=='آپارتمان'||p.type=='دفتر کار'?N(p.fl):'—'],['تعداد طبقات',p.fls?N(p.fls):'—'],['سال ساخت',p.yr?N(p.yr):'—'],['پارکینگ',bm(p.pk)],['انباری',bm(p.st)],['آسانسور',bm(p.el)],['وضعیت',p.vac],['محله',p.hood]];
app.innerHTML=`<div class=w><div class=dg><div><p style="padding-top:20px;color:var(--mu)"><a href="#/list">املاک</a> / ${p.hood} / ${p.c}</p><div class=ga style="margin-top:10px">${[0,1,2].map(i=>`<div onclick="lb(PR.find(x=>x.c=='${c}'),${i})">${img(p,i)}</div>`).join('')}</div>
<div class=box><span class=cdn style="position:static;background:var(--g);display:inline-block">${p.c}</span><h1 style="font-size:clamp(24px,3.4vw,38px);margin:8px 0">${p.title}</h1><p class=ht>📍 ${p.hood}، شیراز · ${p.type} · ${p.deal=='sale'?'فروش':'رهن و اجاره'}</p><p class=pp style="margin-top:8px">${price(p)}</p><div class=spec>${sp.map(s=>`<div><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div></div>
<div class=box><h3>توضیحات</h3><p style="margin-top:8px;color:var(--mu)">${desc(p)}</p></div></div>
<aside class=ct><div class=box><h3>درخواست بازدید</h3><form onsubmit="rq(event,'${c}')" style="display:grid;gap:10px;margin-top:10px"><input required placeholder="نام و نام خانوادگی"><input required type=tel placeholder="شماره موبایل" pattern="09[0-9]{9}"><input required type=date><textarea rows=2 placeholder="توضیحات (اختیاری)"></textarea><button class=btn>ثبت درخواست</button></form><button class="btn o" style="width:100%;margin-top:10px" onclick="tf('${c}');rt()">${fav.includes(c)?'♥ حذف از علاقه‌مندی':'♡ افزودن به علاقه‌مندی'}</button></div></aside></div>
${sm.length?`<section class=s style="padding-top:0"><h2>ملک‌های مشابه</h2><div class=gr style="margin-top:16px">${sm.map(card).join('')}</div></section>`:''}</div>`}
function rq(e,c){e.preventDefault();const r=J('rq');r.push({c,t:Date.now()});localStorage.rq=JSON.stringify(r);e.target.reset();toast('✓ درخواست بازدید ثبت شد. کد پیگیری: NR-'+Math.floor(Math.random()*9e4+1e4))}
function md(){$('#mb').innerHTML=`<h3>ثبت ملک</h3><form onsubmit="event.preventDefault();$('#md').classList.remove('show');toast('✓ ملک شما ثبت شد و پس از بررسی نمایش داده می‌شود')" style="display:grid;gap:10px"><select><option>فروش</option><option>رهن و اجاره</option></select><select>${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><select>${HOODS.map(t=>`<option>${t}</option>`).join('')}</select><input required type=number placeholder="متراژ"><input required type=tel placeholder="شماره موبایل" pattern="09[0-9]{9}"><button class=btn>ارسال</button></form>`;$('#md').classList.add('show')}
function rt(){fc();const h=location.hash.slice(2),a=h.split('/');if(h=='list'){if(F.fav){F.fav=0}lst()}else if(h=='fav'){F={...D0,fav:1};lst()}else if(a[0]=='p')detail(a[1]);else home();$$('#nv a').forEach(x=>x.classList.toggle('on',x.dataset.r==(h||'home')));scrollTo(0,0)}
addEventListener('hashchange',rt);rt();
</script></body></html>
