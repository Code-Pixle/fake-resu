<script>

const W=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${d?(r()>.35?'#ffd978':'#4a5a7a'):'#9ec9e8'}"/>`,T=x=>`<rect x="${x-4}" y="375" width="8" height="40" fill="#6b4a32"/><circle cx="${x}" cy="360" r="${24+r()*8|0}" fill="${d?'#1f4a3a':'#4f8a55'}"/>`,dk=d?'#2a2f45':'#8b7d6b';

else if(p.type=='ویلا'){s+=`<rect x="150" y="285" width="330" height="120" fill="${wc}"/><rect x="250" y="205" width="230" height="80" fill="${wc}" opacity=".95"/><rect x="140" y="275" width="350" height="12" fill="${dk}"/><rect x="240" y="195" width="250" height="12" fill="${dk}"/>`+W(170,310,90,60)+W(290,310,80,60)+W(270,225,90,45)+W(390,225,70,45)+`<rect x="400" y="335" width="50" height="70" fill="${dk}"/><rect x="520" y="425" width="230" height="46" rx="10" fill="${d?'#2f6f8f':'#5ab4de'}"/>${T(90)}${T(540)}${T(720)}`}

const D0={q:'',deal:'',type:'',pmin:'',pmax:'',dmin:'',dmax:'',rmin:'',rmax:'',amin:'',amax:'',beds:0,floor:'',hood:'',park:'',store:'',elev:'',vac:'',sort:'new',fav:0};

const app=$('#app'),bm=v=>v?'دارد':'ندارد';let V='grid',PO=false;
const card=p=>`<a class=k href="#/p/${p.c}"><div class=ii>${img(p,0)}</div><div class=kb><span class="${p.vac=='فوری'?'u':''}">${p.vac=='فوری'?'فوری':p.deal=='sale'?'فروش':'رهن و اجاره'}</span><span class=d>${p.c}</span></div><button class=kh onclick="event.preventDefault();tf('${p.c}');rt()">${fav.includes(p.c)?'♥':'♡'}</button><div class=kt><h3>${p.title}</h3><small>${p.hood} · ${p.type} · ${N(p.area)} متر${p.beds?' · '+N(p.beds)+' خواب':''}</small><b>${price(p)}</b></div></a>`;
function home(){const hc=HOODS.map(h=>[h,PR.filter(p=>p.hood==h).length]).filter(x=>x[1]);const s=[...PR].sort((a,b)=>a.days-b.days);
app.innerHTML=`<section class=hero><div class=w><div><span class=tg>ARG ESTATE · SHIRAZ</span><h1><span>شیراز را</span><br>از <em>نو</em> ببین</h1><p class=l>آپارتمان، ویلا، زمین و فضای تجاری؛ با فیلترهای دقیق و گالری کامل تصاویر و پلان. ملک بعدی‌ات همین‌جاست.</p>
<div class=fbar><div class=dt id=dt><button class=on onclick="dt('sale',this)">خرید</button><button onclick="dt('rent',this)">رهن و اجاره</button></div><select id=hh><option value="">همه‌ی محله‌ها</option>${HOODS.map(h=>`<option>${h}</option>`).join('')}</select><select id=hy><option value="">همه‌ی انواع</option>${TYPES.map(h=>`<option>${h}</option>`).join('')}</select><button class=b onclick=hs()>جستجو ←</button></div></div>
<div class=stk><div class="c c1">${img(PR[6],0)}</div><div class="c c2">${img(PR[1],1)}</div><div class="c c3">${img(PR[11],0)}</div></div></div></section>
<div class=mq><div>${'آپارتمان ✦ ویلا ✦ زمین ✦ مغازه ✦ دفتر کار ✦ شیراز ✦ '.repeat(10)}</div></div>
<div class=w><div class=cn><div><b>${N(PR.length)}</b><span>ملک فعال</span></div><div><b>${N(PR.filter(p=>p.deal=='sale').length)}</b><span>فروش</span></div><div><b>${N(PR.filter(p=>p.deal=='rent').length)}</b><span>رهن و اجاره</span></div><div><b>${N(PR.filter(p=>p.vac=='فوری').length)}</b><span>آگهی فوری</span></div></div>
<section class=s><div class=sh><div><h2>تازه‌ترین‌ها</h2><p>آخرین آگهی‌های ثبت‌شده</p></div><a class="b o" href="#/list">همه‌ی املاک</a></div><div class=rail>${s.slice(0,8).map(card).join('')}</div></section>
<section class=s><div class=sh><div><h2>محله‌ها</h2><p>مستقیم برو سراغ محله‌ی دلخواه</p></div></div><div class=hoods>${hc.map(h=>`<button onclick="F={...D0,hood:'${h[0]}'};location.hash='#/list'"><b>${N(h[1])}</b>${h[0]}</button>`).join('')}</div></section>
<section class=s><div class=cta><div><h2>ملک داری؟</h2><p style="color:var(--mu)">آگهی‌ات را رایگان ثبت کن.</p></div><button class=b onclick=md()>ثبت ملک</button></div></section></div>`}
let hd='sale';function dt(d,b){hd=d;$$('#dt button').forEach(x=>x.classList.toggle('on',x==b))}
function hs(){F={...D0,deal:hd,hood:$('#hh').value,type:$('#hy').value};location.hash='#/list'}
const sel=(k,o,l)=>`<label>${l}<select onchange="set('${k}',this.value,${k=='deal'?1:0})">${o.map(x=>`<option value="${x[0]}" ${String(F[k])===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select></label>`,rg=(a,b,l)=>`<label>${l}<div class=r><input type=number inputmode=numeric placeholder="از" value="${F[a]}" oninput="set('${a}',this.value)"><input type=number inputmode=numeric placeholder="تا" value="${F[b]}" oninput="set('${b}',this.value)"></div></label>`;
const YN=[['','مهم نیست'],['1','دارد'],['0','ندارد']];
function panel(){return sel('deal',[['','همه'],['sale','فروش'],['rent','رهن و اجاره']],'نوع معامله')+sel('type',[['','همه'],...TYPES.map(t=>[t,t])],'نوع ملک')+sel('hood',[['','همه'],...HOODS.map(t=>[t,t])],'محله')
+(F.deal=='sale'?rg('pmin','pmax','قیمت (میلیون تومان)'):'')+(F.deal=='rent'?rg('dmin','dmax','ودیعه (میلیون)')+rg('rmin','rmax','اجاره‌ی ماهانه (میلیون)'):'')+rg('amin','amax','متراژ (متر)')
+sel('beds',[[0,'همه'],[1,'۱ خواب به بالا'],[2,'۲ خواب به بالا'],[3,'۳ خواب به بالا'],[4,'۴ خواب به بالا']],'اتاق خواب')+sel('floor',[['','همه'],['0','همکف'],['1','۱ تا ۳'],['4','۴ تا ۶'],['7','۷ به بالا']],'طبقه')
+sel('park',YN,'پارکینگ')+sel('store',YN,'انباری')+sel('elev',YN,'آسانسور')+sel('vac',[['','همه'],['خالی','خالی'],['در حال سکونت','در حال سکونت'],['فوری','فوری']],'وضعیت')}
function set(k,v,re){F[k]=k=='beds'?+v:v;re?lst():rl()}
function chips(){const L={deal:v=>v=='sale'?'فروش':'رهن و اجاره',type:v=>v,hood:v=>v,beds:v=>'حداقل '+N(v)+' خواب',floor:v=>'طبقه: '+({0:'همکف',1:'۱ تا ۳',4:'۴ تا ۶',7:'۷+'})[v],park:v=>'پارکینگ '+bm(+v),store:v=>'انباری '+bm(+v),elev:v=>'آسانسور '+bm(+v),vac:v=>v,pmin:v=>'قیمت از '+N(v),pmax:v=>'قیمت تا '+N(v),dmin:v=>'ودیعه از '+N(v),dmax:v=>'ودیعه تا '+N(v),rmin:v=>'اجاره از '+N(v),rmax:v=>'اجاره تا '+N(v),amin:v=>'متراژ از '+N(v),amax:v=>'متراژ تا '+N(v)};
return Object.keys(L).filter(k=>F[k]!==D0[k]&&F[k]!=='').map(k=>`<button onclick="F['${k}']=D0['${k}'];lst()">${L[k](F[k])}</button>`).join('')}
function rl(){const l=list();$('#cnt').innerHTML=`🏠 ${N(l.length)} ملک`;$('#ch').innerHTML=chips();$('#res').className=V=='grid'?'gv':'lv';$('#res').innerHTML=l.map(card).join('')||'<p style="grid-column:1/-1;text-align:center;padding:70px;color:var(--mu)">ملکی با این فیلترها پیدا نشد.</p>'}

function detail(c){const p=PR.find(x=>x.c==c);if(!p)return home();const sm=PR.filter(x=>x.c!=c&&(x.deal==p.deal||x.hood==p.hood)).slice(0,4);
const sp=[['متراژ',N(p.area)+' متر'],['اتاق خواب',p.beds?N(p.beds):'—'],['طبقه',p.type=='آپارتمان'||p.type=='دفتر کار'?N(p.fl):'—'],['تعداد طبقات',p.fls?N(p.fls):'—'],['سال ساخت',p.yr?N(p.yr):'—'],['پارکینگ',bm(p.pk)],['انباری',bm(p.st)],['آسانسور',bm(p.el)],['وضعیت',p.vac],['محله',p.hood],['نوع',p.type],['معامله',p.deal=='sale'?'فروش':'رهن و اجاره']];
app.innerHTML=`<div class=w><div class=dh onclick="lb(PR.find(x=>x.c=='${c}'),0)">${img(p,0)}<div class=t><span class=tg>${p.c}</span><h1>${p.title}</h1><p style="color:#d6d6dc">${p.hood}، شیراز</p></div></div><div class=th>${[0,1,2].map(i=>`<div onclick="lb(PR.find(x=>x.c=='${c}'),${i})">${img(p,i)}</div>`).join('')}</div>

${sm.length?`<section class=s style="padding-top:0"><div class=sh><h2>مشابه</h2></div><div class=rail>${sm.map(card).join('')}</div></section>`:''}</div>`}
function rq(e,c){e.preventDefault();const r=J('rq');r.push({c,t:Date.now()});localStorage.rq=JSON.stringify(r);e.target.reset();toast('✓ درخواست ثبت شد · کد: AE-'+Math.floor(Math.random()*9e4+1e4))}

function rt(){const h=location.hash.slice(2),a=h.split('/');$('#fn').textContent=fav.length?N(fav.length):'';if(h=='list'){F.fav=0;lst()}else if(h=='fav'){F={...D0,fav:1};lst()}else if(a[0]=='p')detail(a[1]);else home();$$('#nv a').forEach(x=>x.classList.toggle('on',x.dataset.r==(h||'home')));if(!h.startsWith('fav')&&!h.startsWith('list')||1)scrollTo(0,0)}
