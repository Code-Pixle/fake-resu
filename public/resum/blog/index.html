<!doctype html><html lang=fa dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>حاشیه | یادداشت‌هایی برای ذهن‌های کنجکاو</title>
  <link rel="stylesheet" href="../../fonts/local-fonts.css">
<style>
:root{--bg:#0c0b10;--bg2:#16141d;--tx:#ece8f5;--mu:#8d88a3;--ac:#ffb84d;--ac2:#a78bfa;--bd:#ffffff18}
[data-t=light]{--bg:#f6f2ea;--bg2:#fffdf8;--tx:#1b1822;--mu:#6e6a7c;--ac:#c2410c;--ac2:#6d28d9;--bd:#00000018}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--tx);line-height:2;transition:.3s}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}
#pg{position:fixed;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0;z-index:100}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 6vw;position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{font-size:28px;font-weight:900;letter-spacing:-1px;cursor:pointer}.logo i{color:var(--ac);font-style:normal}
.ib{border:1px solid var(--bd);border-radius:40px;padding:6px 16px;margin-right:8px;font-size:14px;color:var(--mu)}.ib:hover{border-color:var(--ac);color:var(--ac)}
.hero{padding:10vh 6vw 6vh}.hero small{color:var(--ac);letter-spacing:2px}.hero h1{font-size:clamp(40px,8vw,118px);line-height:1.15;font-weight:900;margin:10px 0}.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}.hero p{max-width:520px;color:var(--mu)}
.feat{margin:0 6vw;border-radius:34px;background:var(--bg2);border:1px solid var(--bd);display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden;cursor:pointer;transition:.4s}.feat:hover{transform:translateY(-6px);border-color:var(--ac)}.feat .tx{padding:5vw}.feat h2{font-size:clamp(26px,4vw,46px);line-height:1.4;margin:10px 0}
.ph{position:relative;display:grid;place-items:center;font-size:80px;overflow:hidden;min-height:200px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ph small{position:absolute;bottom:8px;font-size:10px;opacity:.5;direction:ltr}
.tg{display:inline-block;color:var(--ac);font-size:13px;border:1px solid var(--ac);padding:0 12px;border-radius:30px;line-height:1.9}.mt{color:var(--mu);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:6vh 6vw 2vh}.tags button{border:1px solid var(--bd);padding:6px 18px;border-radius:30px;color:var(--mu)}.tags button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:2vh 6vw 8vh}.c{background:var(--bg2);border:1px solid var(--bd);border-radius:26px;overflow:hidden;cursor:pointer;transition:.35s;display:flex;flex-direction:column}.c:hover{transform:translateY(-8px);border-color:var(--ac2)}.c .ph{aspect-ratio:16/9;font-size:54px}.c .in{padding:20px;display:grid;gap:8px}.c h3{font-size:20px;line-height:1.6}.c p{color:var(--mu);font-size:14px}
.nl{margin:0 6vw 8vh;padding:7vh 5vw;border-radius:34px;background:linear-gradient(120deg,var(--ac2),var(--ac));color:#0c0b10;text-align:center}.nl h2{font-size:clamp(26px,4vw,44px);font-weight:900}.nl form{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}.nl input{padding:12px 22px;border-radius:40px;border:0;background:#fff;color:#000;min-width:260px}.nl button{background:#0c0b10;color:#fff;padding:12px 30px;border-radius:40px}
article{max-width:1100px;margin:0 auto;padding:8vh 6vw;display:grid;grid-template-columns:1fr 230px;gap:50px}.ar h1{font-size:clamp(32px,5.5vw,64px);line-height:1.3;font-weight:900;margin:14px 0}.ar .ph{border-radius:28px;aspect-ratio:16/8;margin:26px 0}
.ar h2{font-size:28px;margin:40px 0 8px;scroll-margin-top:90px}.ar p{font-size:18px;color:color-mix(in srgb,var(--tx) 88%,transparent);margin-bottom:12px}.ar section>p:first-of-type:first-letter{}.dc::first-letter{float:right;font-size:72px;line-height:.9;padding-left:12px;color:var(--ac);font-weight:900}
.toc{position:sticky;top:90px;align-self:start;border-right:2px solid var(--bd);padding-right:18px;font-size:14px}.toc b{color:var(--mu)}.toc a{display:block;color:var(--mu);padding:4px 0}.toc a:hover{color:var(--ac)}
.act{display:flex;gap:10px;margin:26px 0;flex-wrap:wrap}.act button{border:1px solid var(--bd);border-radius:40px;padding:6px 20px}.act button.on{background:var(--ac);color:#000;border-color:var(--ac)}
.cm{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:12px 18px;margin:10px 0}.cm b{color:var(--ac2)}
.cf input,.cf textarea{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:10px;outline:0}.cf input:focus,.cf textarea:focus{border-color:var(--ac)}.cf button{background:var(--ac);color:#000;border-radius:40px;padding:10px 30px;font-weight:800}
.rel{grid-column:1/-1}.rel .grid{padding:10px 0}
.sr{position:fixed;inset:0;background:#000d;z-index:90;display:none;padding:12vh 6vw}.sr.show{display:block}.sr input{width:100%;max-width:700px;display:block;margin:0 auto 20px;background:var(--bg2);border:1px solid var(--ac);border-radius:20px;padding:18px 24px;font-size:20px;outline:0}.sr div{max-width:700px;margin:auto}.sr a{display:block;background:var(--bg2);border-radius:16px;padding:12px 20px;margin-bottom:8px;cursor:pointer}.sr a:hover{border:1px solid var(--ac)}
footer{padding:6vh;text-align:center;color:var(--mu);font-size:13px;border-top:1px solid var(--bd)}
@media(max-width:800px){.feat,article{grid-template-columns:1fr}.toc{display:none}}
</style></head><body data-t=dark><div id=pg></div>
<header><div class=logo onclick="location.hash=''">حاشیه<i>.</i></div><div><button class=ib onclick=so()>🔍 جستجو (Ctrl+K)</button><button class=ib id=th onclick=tt()>☾</button></div></header>
<div id=app></div><footer>حاشیه · نوشته‌شده برای ذهن‌های کنجکاو</footer>
<div class=sr id=sr onclick="if(event.target==this)sc()"><input id=q placeholder="دنبال چه می‌گردید؟"><div id=sres></div></div>
<script>
const L1="هر ایده‌ی خوب از یک سؤال ساده شروع می‌شود؛ سؤالی که کسی وقت نکرده بپرسد. وقتی اجازه بدهیم کنجکاوی ما را جلو ببرد، مسیرهایی باز می‌شود که در برنامه‌ریزی دقیق هرگز دیده نمی‌شد.";
const A=[
["چرا کم‌نویسی ذهن را شفاف می‌کند","نوشتن","✍️",5,300,[["حذف، مهم‌تر از افزودن","وقتی مجبور باشیم یک فکر را در سه جمله بگوییم، ناچاریم بفهمیم واقعاً چه می‌خواهیم بگوییم. کم‌نویسی تمرین انتخاب است، نه تمرین خسیسی در کلمه."],["یک قاعده‌ی کاربردی","پیش‌نویس اول را بنویس و بعد نیمی از آن را حذف کن. باقی‌مانده معمولاً همان چیزی است که خواننده به آن نیاز داشت."],["نتیجه","متن کوتاه یعنی احترام به وقت خواننده. هر جمله باید جای خودش را ثابت کند، وگرنه باید برود."]]],
["هنر تمرکز در دنیایی پر از اعلان","بهره‌وری","🎯",6,260,[["مسئله‌ی واقعی","تمرکز از بین نرفته، فقط گران شده است. هر اعلان یک قرارداد کوچک برای تقسیم توجه است و ما آن را بدون خواندن امضا می‌کنیم."],["سه تغییر کوچک","گوشی را هنگام کار در اتاق دیگر بگذار، بازه‌های کار عمیق چهل‌دقیقه‌ای تعریف کن و اعلان‌ها را فقط برای آدم‌ها روشن نگه دار، نه برنامه‌ها."],["بعد از آن","بعد از دو هفته، ذهن یاد می‌گیرد که سکوت خطرناک نیست و کار عمیق دوباره لذت‌بخش می‌شود."]]],
["کتابی که دوباره خواندم و فرق کرد","کتاب","📚",5,40,[["همان کتاب، خواننده‌ی دیگر","کتاب‌ها تغییر نمی‌کنند، ما می‌کنیم. خواندن دوباره یک اثر آشنا بیشتر از هر چیز، تصویری از تغییرات خودمان است."],["چه چیزی دیده شد","جمله‌هایی که بار اول رد شده بودند حالا مرکز کتاب بودند. بدون عجله خواندن، لایه‌هایی را نشان می‌دهد که سرعت می‌پوشاند."],["پیشنهاد","هر سال یک کتاب را دوباره بخوان؛ آن را مثل آینه کنار تاریخ زندگی‌ات بگذار."]]],
["قدم‌زدن بی‌هدف؛ یک تمرین جدی","سبک زندگی","🚶",4,150,[["بدون مقصد","قدم‌زدن بی‌هدف یعنی مسیر را به شانس سپردن. ذهن در این حالت از حالت وظیفه بیرون می‌آید و به ایده‌ها اجازه‌ی ظاهر شدن می‌دهد."],["چطور شروع کنیم","بیست دقیقه، بدون هدفون و بدون مسیر مشخص. اگر چیزی توجهت را گرفت، بایست و نگاهش کن."],["اثر","بسیاری از گره‌های کاری درست وقتی باز می‌شوند که از آن‌ها دور شده‌ایم."]]],
["نظم در کارهای کوچک، آرامش در کارهای بزرگ","بهره‌وری","🗂️",5,200,[["اصل ساده","نظم یعنی تصمیم‌های کوچک را از قبل گرفتن. هر تصمیم از پیش‌گرفته‌شده، انرژی ذهنی را برای کارهای مهم ذخیره می‌کند."],["نمونه‌ها","لباس فردا را امشب آماده کن، فهرست سه کار مهم هر روز را شب قبل بنویس و میز کار را آخر روز خالی کن."],["جمع‌بندی","نظم هدف نیست؛ ابزاری است برای اینکه حواست به چیزهای مهم بماند."]]],
["یک شهر، یک پیاده‌روی، هزار داستان","سبک زندگی","🏙️",7,330,[["شهر را با پا بخوان","شهر را از پشت شیشه‌ی ماشین نمی‌شود فهمید. کوچه‌ها، مغازه‌های قدیمی و صدای ظهر محله‌ها فقط با پای پیاده شنیده می‌شوند."],["راهنمای کوتاه","صبح زود برو، یک نقشه‌ی کوچک همراه داشته باش و عمداً یک‌جا را اشتباه بپیچ."],["پایان","هر شهری پر است از داستان‌هایی که هنوز کسی ننوشته؛ تو می‌توانی اولین نفر باشی."]]]
].map((a,i)=>({id:i,t:a[0],g:a[1],e:a[2],m:a[3],h:a[4],s:a[5],img:['images/blog-01-6badbd99.avif','images/blog-02-43a1d085.avif','images/blog-03-01fdca07.avif','images/blog-04-4a204aee.avif','images/blog-05-37a7232a.avif','images/blog-06-a8090b62.avif'][i]}));
const $=s=>document.querySelector(s),J=k=>JSON.parse(localStorage[k]||'[]'),n=x=>x.toLocaleString('fa-IR');
let tag='همه',lk=J('bl'),bm=J('bb');
const ph=(a,c='')=>`<div class="ph ${c}" style="background:linear-gradient(135deg,hsl(${a.h} 60% 28%),hsl(${a.h+50} 60% 14%))">${a.e}<img src="${a.img}" onerror="this.remove()"><small>${a.img}</small></div>`;
const card=a=>`<div class=c onclick="location.hash='p${a.id}'">${ph(a)}<div class=in><span class=tg>${a.g}</span><h3>${a.t}</h3><p>${a.s[0][1].slice(0,95)}…</p><span class=mt>${n(a.m)} دقیقه مطالعه</span></div></div>`;
function home(){const f=A[0],tg=['همه',...new Set(A.map(a=>a.g))];
$('#app').innerHTML=`<section class=hero><small>— یادداشت‌های هفتگی</small><h1>ایده‌هایی که<br><span>ارزش خواندن</span> دارند</h1><p>درباره‌ی نوشتن، تمرکز، کتاب و زندگی روزمره؛ کوتاه، دقیق و بدون حاشیه.</p></section>
<div class=feat onclick="location.hash='p0'"><div class=tx><span class=tg>${f.g} · برگزیده</span><h2>${f.t}</h2><p style="color:var(--mu)">${f.s[0][1]}</p><span class=mt>${n(f.m)} دقیقه مطالعه</span></div>${ph(f)}</div>
<div class=tags>${tg.map(t=>`<button class="${t==tag?'on':''}" onclick="tag='${t}';home()">${t}</button>`).join('')}</div><div class=grid>${A.filter(a=>tag=='همه'||a.g==tag).map(card).join('')}</div>
<div class=nl><h2>هر هفته یک یادداشت در ایمیل شما</h2><form onsubmit="event.preventDefault();this.innerHTML='<b>✓ ثبت شد، ممنون!</b>'"><input type=email required placeholder="ایمیل شما"><button>عضویت</button></form></div>`;scrollTo(0,0)}
function post(a){const c=J('bc'+a.id),rel=A.filter(x=>x.id!=a.id&&x.g==a.g).concat(A.filter(x=>x.id!=a.id&&x.g!=a.g)).slice(0,3);
$('#app').innerHTML=`<article><div class=ar><span class=tg>${a.g}</span><h1>${a.t}</h1><span class=mt>${n(a.m)} دقیقه مطالعه · ${n(lk.includes(a.id)?1:0)} پسند</span>${ph(a)}${a.s.map((s,i)=>`<h2 id=h${i}>${s[0]}</h2><p class="${i?'':'dc'}">${s[1]}</p>${i==0?`<p>${L1}</p>`:''}`).join('')}
<div class=act><button class="${lk.includes(a.id)?'on':''}" onclick="tl(${a.id})">♥ پسندیدم</button><button class="${bm.includes(a.id)?'on':''}" onclick="tb(${a.id})">🔖 ذخیره</button><button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href);this.textContent='✓ کپی شد'">🔗 کپی لینک</button></div>
<h2>دیدگاه‌ها (${n(c.length)})</h2>${c.map(x=>`<div class=cm><b>${x.n}</b><br>${x.t}</div>`).join('')}<form class=cf onsubmit="cmt(event,${a.id})"><input required id=cn placeholder="نام شما"><textarea required id=ct rows=3 placeholder="دیدگاه شما..."></textarea><button>ارسال دیدگاه</button></form></div>
<div class=toc><b>در این یادداشت</b>${a.s.map((s,i)=>`<a href="javascript:document.getElementById('h${i}').scrollIntoView()">${s[0]}</a>`).join('')}</div>
<div class=rel><h2 style="margin-top:40px">بیشتر بخوانید</h2><div class=grid>${rel.map(card).join('')}</div></div></article>`;scrollTo(0,0)}
function route(){const h=location.hash.slice(2);h!==''&&A[h]?post(A[h]):home()}
function tl(i){lk=lk.includes(i)?lk.filter(x=>x!=i):[...lk,i];localStorage.bl=JSON.stringify(lk);post(A[i])}
function tb(i){bm=bm.includes(i)?bm.filter(x=>x!=i):[...bm,i];localStorage.bb=JSON.stringify(bm);post(A[i])}
function cmt(e,i){e.preventDefault();const c=J('bc'+i);c.push({n:$('#cn').value,t:$('#ct').value});localStorage['bc'+i]=JSON.stringify(c);post(A[i])}
function tt(){const b=document.body;b.dataset.t=b.dataset.t=='dark'?'light':'dark';$('#th').textContent=b.dataset.t=='dark'?'☾':'☀';localStorage.bt=b.dataset.t}
function so(){$('#sr').classList.add('show');$('#q').value='';sr();$('#q').focus()}function sc(){$('#sr').classList.remove('show')}
function sr(){const v=$('#q').value;$('#sres').innerHTML=A.filter(a=>(a.t+a.g+a.s.map(s=>s[1]).join('')).includes(v)).map(a=>`<a onclick="sc();location.hash='p${a.id}'">${a.e} ${a.t} <span class=mt>· ${a.g}</span></a>`).join('')||'<p class=mt>نتیجه‌ای نیست</p>'}
$('#q').oninput=sr;addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();so()}if(e.key=='Escape')sc()});
addEventListener('scroll',()=>{const d=document.documentElement;$('#pg').style.width=d.scrollTop/(d.scrollHeight-d.clientHeight||1)*100+'%'});
addEventListener('hashchange',route);if(localStorage.bt){document.body.dataset.t=localStorage.bt;$('#th').textContent=localStorage.bt=='dark'?'☾':'☀'}route();
</script></body></html>
